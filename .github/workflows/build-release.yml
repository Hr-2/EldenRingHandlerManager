name: Build and Release

on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '6.0.x'

      - name: Restore
        run: dotnet restore EldenRingHandlerManager.csproj

      - name: Build (Release)
        run: dotnet build EldenRingHandlerManager.csproj -c Release --no-restore

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: EldenRingHandlerManager
          path: bin/Release/net6.0-windows/

  # Dev build: refreshed on every push to master/main.
  dev-release:
    needs: build
    if: startsWith(github.ref, 'refs/heads/master') || startsWith(github.ref, 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: EldenRingHandlerManager
          path: dist

      - name: Zip build
        run: |
          cd dist
          zip -r EldenRingHandlerManager.zip .

      - name: Create/Update Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "latest" --yes --repo "${{ github.repository }}" 2>/dev/null || true
          gh release create "latest" "dist/EldenRingHandlerManager.zip" \
            --repo "${{ github.repository }}" \
            --title "Latest build" \
            --notes "Auto-built from the latest commit."

  # Versioned release: published when a tag like v1.0.0 is pushed.
  versioned-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: EldenRingHandlerManager
          path: dist

      - name: Zip build
        run: |
          cd dist
          zip -r EldenRingHandlerManager.zip .

      - name: Extract release notes
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          chmod +x .github/scripts/get-release-notes.sh
          NOTES="$(.github/scripts/get-release-notes.sh "$VERSION" CHANGELOG.md)"
          echo "NOTES<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/EldenRingHandlerManager.zip" \
            --repo "${{ github.repository }}" \
            --title "Elden Ring Handler Manager $GITHUB_REF_NAME" \
            --notes "${{ steps.notes.outputs.NOTES }}"
