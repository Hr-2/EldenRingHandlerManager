name: Auto Version & Release

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ───── Bump version on every push to master (skip bot commits) ─────
  bump:
    if: >
      !startsWith(github.event.head_commit.message, 'chore(release)')
      && (startsWith(github.ref, 'refs/heads/master') || startsWith(github.ref, 'refs/heads/main'))
    runs-on: ubuntu-latest
    outputs:
      next: ${{ steps.bump.outputs.NEXT }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version and update changelog
        id: bump
        run: |
          OUT=$(python3 .github/scripts/bump-version.py)
          echo "$OUT"
          NEXT=$(echo "$OUT" | grep -oP 'NEXT=\K.*')
          echo "NEXT=$NEXT" >> "$GITHUB_OUTPUT"
          echo "TAG=v$NEXT" >> "$GITHUB_OUTPUT"

      - name: Commit and push version bump + tag
        run: |
          NEXT="${{ steps.bump.outputs.NEXT }}"
          git add -A
          git commit -m "chore(release): v$NEXT"
          git tag "v$NEXT"
          git push origin master
          git push origin "v$NEXT"

  # ───── Build the tagged version (runs in the same run) ─────
  build:
    needs: [bump]
    if: always() && needs.bump.result == 'success'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Checkout bumped tag
        run: |
          git checkout "v${{ needs.bump.outputs.next }}"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '6.0.x'

      - name: Restore
        run: dotnet restore EldenRingHandlerManager.csproj

      - name: Build (Release)
        run: dotnet build EldenRingHandlerManager.csproj -c Release --no-restore

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: EldenRingHandlerManager
          path: bin/Release/net6.0-windows/

  # ───── Publish versioned release ─────
  release:
    needs: [bump, build]
    if: always() && needs.bump.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Checkout bumped tag
        run: |
          git checkout "v${{ needs.bump.outputs.next }}"

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: EldenRingHandlerManager
          path: dist

      - name: Zip build
        run: |
          cd dist
          zip -r EldenRingHandlerManager.zip .

      - name: Extract release notes
        run: |
          chmod +x .github/scripts/get-release-notes.sh
          .github/scripts/get-release-notes.sh "${{ needs.bump.outputs.next }}" CHANGELOG.md > RELEASE_NOTES.md

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ needs.bump.outputs.next }}" "dist/EldenRingHandlerManager.zip" \
            --repo "${{ github.repository }}" \
            --title "Elden Ring Handler Manager v${{ needs.bump.outputs.next }}" \
            --notes-file RELEASE_NOTES.md
