name: Build and Release

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore
        run: dotnet restore EldenRingHandlerManager.csproj

      - name: Build (Release)
        run: dotnet build EldenRingHandlerManager.csproj -c Release --no-restore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EldenRingHandlerManager
          path: bin/Release/net6.0-windows/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/heads/master') || startsWith(github.ref, 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: EldenRingHandlerManager
          path: dist

      - name: Zip build
        run: |
          cd dist
          zip -r EldenRingHandlerManager.zip .

      - name: Create/Update Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "latest" --yes --repo "${{ github.repository }}" 2>/dev/null || true
          gh release create "latest" "dist/EldenRingHandlerManager.zip" \
            --repo "${{ github.repository }}" \
            --title "Latest build" \
            --notes "Auto-built from the latest commit."
